[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rediscovery-tax"
version = "0.2.0"
description = "Measure repeated fact discovery across agent sessions"
requires-python = ">=3.11"

[project.scripts]
rediscovery-tax = "rediscovery_tax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
